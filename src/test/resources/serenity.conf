serenity {

  driver = chrome
  browser.maximized = true

  webdriver {
    driver = chrome
    autodownload = true
    capabilities {
      browserName = "chrome"
      acceptInsecureCerts = true
      "goog:chromeOptions" {
        args = ["remote-allow-origins=*", "test-type", "no-sandbox", "ignore-certificate-errors", "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking", "disable-extensions", "disable-features=PasswordLeakDetection", "headless=new"]
        prefs {
          "profile.password_manager_enabled" = false
          "credentials_enable_service" = false
          "profile.default_content_setting_values.notifications" = 2
        }
      }
    }
  }

  base.url = "https://www.saucedemo.com/"

  take.screenshots = AFTER_EACH_STEP
  screenshots.directory = target/serenity-reports/screenshots

  webdriver.timeouts.implicitlywait = 5000
  webdriver.wait.for.timeout = 15000

  report.test.durations = false
  history.directory = "history"
  outputDirectory = target/serenity-reports

  parallel.tests = 1

  webdriver.quit.dontQuitAfterEachScenario = false
  webdriver.provided.type = provided
  
  tags = ""
}

environments {
  default {
    base.url = "https://www.saucedemo.com/"
  }
  staging {
    base.url = "https://www.saucedemo.com/"
  }
}
